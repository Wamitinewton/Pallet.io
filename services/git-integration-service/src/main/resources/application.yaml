server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful
  # api-gateway is the only thing exposed to callers, so the socket peer is always the gateway.
  forward-headers-strategy: native

spring:
  application:
    name: git-integration-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      enabled: false
  task:
    scheduling:
      # On shutdown the delivery poll finishes the batch it claimed before the pool, and then the datasource, go away.
      shutdown:
        await-termination: true
        await-termination-period: 30s
      pool:
        # The delivery poll can hold its thread through a GitHub call, and the daily jobs and retention sweeps through a
        # long run; the outbox relay and the gauges must not wait on them.
        size: 16
  datasource:
    hikari:
      # GitHub abandons a webhook after 10s; with Postgres unreachable the handler must answer 503 well before that.
      connection-timeout: 3000
  data:
    redis:
      # Sessions are the only thing Redis holds for this service; an outage has to fail fast, not hang a request.
      timeout: 2s
      connect-timeout: 2s
  flyway:
    schemas: git_integration
    default-schema: git_integration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: git_integration

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
