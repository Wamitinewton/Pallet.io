server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful
  # api-gateway is the only thing exposed to callers, so the socket peer is always the gateway.
  forward-headers-strategy: native

spring:
  application:
    name: build-queue-service
  config:
    import:
      - optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      enabled: false
  datasource:
    hikari:
      connection-timeout: 3000
  data:
    redis:
      # Only the session revocation registry lives in Redis; an outage has to fail a request fast, not hang it.
      timeout: 2s
      connect-timeout: 2s
  flyway:
    schemas: build_queue
    default-schema: build_queue
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: build_queue

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
