spring:
  datasource:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  cloud:
    config:
      enabled: false
  kafka:
    consumer:
      group-id: org-team-service-test-${random.uuid}
      auto-offset-reset: earliest
    producer:
      properties:
        max.block.ms: 3000
        request.timeout.ms: 2000
        delivery.timeout.ms: 3000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:1/not-used-in-tests

pallet:
  messaging:
    publish:
      send-timeout: 3s
  invites:
    signing-key: test-only-signing-key-not-used-in-production
  orgteam:
    outbox:
      enabled: false
      max-attempts: 3
    retention:
      enabled: false
      sweep-batch-size: 10

springdoc:
  api-docs:
    path: /org-team/v3/api-docs

management:
  tracing:
    sampling:
      probability: 1.0
