name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:

  scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.classify.outputs.full }}
      common_modules: ${{ steps.classify.outputs.common_modules }}
      services_matrix: ${{ steps.classify.outputs.services_matrix }}
      services_all: ${{ steps.classify.outputs.services_all }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          services_all="$(find services -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -cs .)"
          echo "services_all=$services_all" >> "$GITHUB_OUTPUT"
          echo "known services: $services_all"

          full_build() {
            echo "full=true"                     >> "$GITHUB_OUTPUT"
            echo "common_modules=[]"              >> "$GITHUB_OUTPUT"
            echo "services_matrix=$services_all"  >> "$GITHUB_OUTPUT"
            echo "$1"
            exit 0
          }

          if [ "$EVENT" = "pull_request" ]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              full_build "no usable base commit for $EVENT -> platform-common reactor + every service"
            fi
          fi

          changed="$(git diff --name-only "$base"...HEAD)"
          echo "Changed files:"
          printf '%s\n' "$changed"

          shared="$(printf '%s\n' "$changed" | grep -E '^platform-common/(pom\.xml|mvnw|mvnw\.cmd|spotbugs-exclude\.xml|owasp-suppressions\.xml)$|^platform-common/\.mvn/|^\.github/workflows/build\.yml$' || true)"
          if [ -n "$shared" ]; then
            full_build "shared change -> platform-common reactor + every service"
          fi

          common_modules="$(printf '%s\n' "$changed" \
            | sed -nE 's#^platform-common/([^/]+)/.*#\1#p' \
            | sort -u | jq -R . | jq -cs .)"
          services_matrix="$(printf '%s\n' "$changed" \
            | sed -nE 's#^services/([^/]+)/.*#\1#p' \
            | sort -u | jq -R . | jq -cs .)"

          echo "full=false"                        >> "$GITHUB_OUTPUT"
          echo "common_modules=$common_modules"     >> "$GITHUB_OUTPUT"
          echo "services_matrix=$services_matrix"   >> "$GITHUB_OUTPUT"
          echo "affected platform-common modules: $common_modules"
          echo "affected services: $services_matrix"

  common-reactor:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: pallet-github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # -DskipITs skips only Failsafe's *IntegrationTest classes (Testcontainers: Postgres,
      # Kafka, Keycloak, ...); Surefire's *Test classes still run. Free GH Actions runners are
      # 2 vCPU and can't reliably boot multiple real containers alongside the app under test —
      # integration tests are a required local gate before opening a PR instead (see Test.md).
      - name: Build platform-common, unit tests only (integration tests run locally, see Test.md)
        working-directory: platform-common
        run: ./mvnw -B clean verify -DskipITs

  common-module:
    needs: scope
    if: needs.scope.outputs.full == 'false' && needs.scope.outputs.common_modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.scope.outputs.common_modules) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: pallet-github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # See the common-reactor job above for why -DskipITs is here.
      - name: Build platform-common/${{ matrix.module }}, unit tests only (integration tests run locally, see Test.md)
        working-directory: platform-common
        run: ./mvnw -B -pl "${{ matrix.module }}" -am -amd clean verify -DskipITs

  service:
    needs: scope
    if: needs.scope.outputs.services_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.scope.outputs.services_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: pallet-github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # See the common-reactor job above for why -DskipITs is here.
      - name: Build ${{ matrix.service }}, unit tests only (integration tests run locally, see Test.md)
        working-directory: services/${{ matrix.service }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B clean verify -DskipITs

  security-common:
    needs: scope
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.common_modules != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: pallet-github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: SpotBugs + FindSecBugs (platform-common)
        working-directory: platform-common
        run: ./mvnw -B -P security -DskipTests -Ddependency-check.skip=true verify

  # Every service owns its own SpotBugs exclude / OWASP suppression files now (see
  # CONTRIBUTING.md), so there is no single reactor-wide command that covers all of them - each
  # affected service gets its own matrix entry instead.
  security-service:
    needs: scope
    if: needs.scope.outputs.services_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.scope.outputs.services_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: pallet-github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: SpotBugs + FindSecBugs (${{ matrix.service }})
        working-directory: services/${{ matrix.service }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -P security -DskipTests -Ddependency-check.skip=true verify

  style:
    runs-on: ubuntu-latest
    env:
      SKIP: spotless-check-platform-common,spotless-check-config-server,spotless-check-notification-service
    steps:
      - uses: actions/checkout@v7
      - uses: pre-commit/action@v3.0.1

  # Single stable status check to require in branch protection. Passes when every build path
  # that actually ran succeeded; a skipped job is fine, it means nothing in its scope changed.
  build:
    needs: [scope, common-reactor, common-module, service, security-common, security-service, style]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "a required job did not pass"
              exit 1
            fi
          done
          echo "build ok"
