name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Work out what a change touches. A push to main always runs a full reactor
  # build — that is the canonical green signal. A PR builds only the affected
  # modules with `-pl <module> -am -amd` (also-make: the module's own
  # dependencies, so it compiles; also-make-dependents: anything that depends
  # on it, so a platform-common change is verified against every consumer),
  # unless it touches something the whole reactor depends on (the parent POM,
  # the Maven wrapper, the platform-common aggregator POM, shared config, or
  # this workflow), in which case it falls back to a full build.
  scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.classify.outputs.full }}
      modules: ${{ steps.classify.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" != "pull_request" ]; then
            echo "full=true"  >> "$GITHUB_OUTPUT"
            echo "modules=[]" >> "$GITHUB_OUTPUT"
            echo "push build -> full reactor"
            exit 0
          fi

          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "Changed files:"
          printf '%s\n' "$changed"

          # Any changed path that is not inside a single module (services/<name>/...
          # or platform-common/<name>/...) forces a full build: the parent POM, the
          # platform-common aggregator POM, shared config and the workflow itself
          # apply to every module, so a change there can break anything.
          shared="$(printf '%s\n' "$changed" | grep -Ev '^(services|platform-common)/[^/]+/' || true)"
          if [ -n "$shared" ]; then
            echo "full=true"  >> "$GITHUB_OUTPUT"
            echo "modules=[]" >> "$GITHUB_OUTPUT"
            echo "shared change -> full reactor"
            exit 0
          fi

          # Only specific modules changed: collect the affected ones, service or
          # platform-common alike.
          modules="$(printf '%s\n' "$changed" \
            | sed -nE 's#^((services|platform-common)/[^/]+)/.*#\1#p' \
            | sort -u | jq -R . | jq -cs .)"
          echo "full=false"        >> "$GITHUB_OUTPUT"
          echo "modules=$modules"  >> "$GITHUB_OUTPUT"
          echo "affected modules: $modules"

  reactor:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, unit + integration tests
        run: ./mvnw -B clean verify

  module:
    needs: scope
    if: needs.scope.outputs.full == 'false' && needs.scope.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.scope.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build ${{ matrix.module }}, its dependencies and its dependents
        run: ./mvnw -B -pl "${{ matrix.module }}" -am -amd clean verify

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: SpotBugs + FindSecBugs
        run: ./mvnw -B -P security -DskipTests -Ddependency-check.skip=true verify


  style:
    runs-on: ubuntu-latest
    env:
      SKIP: spotless-check
    steps:
      - uses: actions/checkout@v7
      - uses: pre-commit/action@v3.0.1

  # Single stable status check to require in branch protection. Passes when the
  # build path that actually ran (reactor or module matrix) succeeded; a
  # skipped job is fine, it means the other path covered the change.
  build:
    needs: [scope, reactor, module, security, style]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "a required job did not pass"
              exit 1
            fi
          done
          echo "build ok"
