name: release

# Publishes platform-common-* to GitHub Packages when a release tag is pushed.
# Uses the repo-scoped GITHUB_TOKEN, not a personal access token - nothing to
# rotate here when a maintainer's own PAT changes. See PACKAGES.md for the
# release process that produces these tags.

on:
  push:
    tags:
      - "platform-common-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Deploy platform-common to GitHub Packages
        run: ./mvnw -B -f platform-common/pom.xml clean deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
