version: 2
updates:
  - package-ecosystem: maven
    directory: "/platform-common"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "io.micrometer*"
          - "io.opentelemetry*"
    ignore:
      # Spring Boot / Spring Cloud majors move together and need a coordinated
      # bump (see the compatibility note in the parent POM) — do those by hand.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/services/config-server"
    schedule:
      interval: weekly
