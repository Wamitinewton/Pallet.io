spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/pallet}
    username: ${POSTGRES_USER:pallet}
    password: ${POSTGRES_PASSWORD:pallet}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

pallet:
  identity:
    keycloak:
      server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
      realm: ${KEYCLOAK_REALM:pallet}
      admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:identity-service}
      admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:identity-service-dev-secret}
      token-client-id: ${KEYCLOAK_TOKEN_CLIENT_ID:pallet-dashboard}
    email-verification:
      code-ttl: PT15M
      max-attempts: 5
    password-reset:
      token-ttl: PT1H
      dashboard-base-url: ${DASHBOARD_BASE_URL:http://localhost:5173}
    rate-limit:
      permits-per-period: 20
      period: PT1M
  invites:
    # Shared HMAC secret for signed action tokens (ARCHITECTURE.md §Signed action tokens).
    # org-team-service mints invite tokens with this same secret under the same env var name;
    # rotating it means rolling it in both services at once.
    signing-key: ${PALLET_INVITES_SIGNING_KEY:caedd236b6a4d38e06869bb5d6d9a0ef17f631b786b805e9bcf31505711f93aa}
  resilience:
    policies:
      keycloak-admin:
        time-limiter:
          timeout: 5s
      keycloak-token:
        time-limiter:
          timeout: 5s

springdoc:
  api-docs:
    path: /identity/v3/api-docs
  swagger-ui:
    enabled: false
