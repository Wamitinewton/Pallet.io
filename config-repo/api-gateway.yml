pallet:
  gateway:
    routes:
      identity-service:
        uri: ${IDENTITY_SERVICE_URI:http://localhost:8082}
        path: /api/v1/identity/**
        allowed-methods: [GET, POST, PATCH, DELETE]
        public-paths:
          - /api/v1/identity/signup
          - /api/v1/identity/invites/*/accept
          - /api/v1/identity/auth/login
          - /api/v1/identity/auth/refresh
          - /api/v1/identity/auth/email/verify
          - /api/v1/identity/auth/email/resend-verification
          - /api/v1/identity/auth/password/forgot
          - /api/v1/identity/auth/password/reset
          - /api/v1/identity/signup/slugs/*/availability
          - /api/v1/identity/v3/api-docs
        resilience-policy: identity-service
      notification-service:
        uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8081}
        path: /api/v1/notification/**
        allowed-methods: [GET, POST, PATCH]
        public-paths:
          - /api/v1/notification/v3/api-docs
        resilience-policy: notification-service
      org-team-service:
        uri: ${ORG_TEAM_SERVICE_URI:http://localhost:8084}
        path: /api/v1/org-team/**
        allowed-methods: [GET, POST, PATCH, DELETE]
        public-paths:
          - /api/v1/org-team/invites/*
          - /api/v1/org-team/v3/api-docs
        resilience-policy: org-team-service
    rate-limit:
      enabled: true
      capacity: 60
      window: 1m

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
