global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Pallet services expose Micrometer metrics at /actuator/prometheus.
  # host.docker.internal reaches services running on the host (mvnw spring-boot:run).
  # Add one target per service as it comes online, or switch to a
  # docker_sd / kubernetes_sd discovery block once services run in-cluster.
  - job_name: pallet-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "host.docker.internal:8888"   # config-server
        labels:
          env: local
