# A single local cluster that stands in for both the EKS and GKE workload
# clusters scheduler-service will register against later. The deploy path needs
# a real Kubernetes API to talk to; docker-compose alone cannot provide that.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pallet
# Per-registry hosts.toml files under certs.d are how the nodes learn that
# pallet-registry:5000 speaks plain HTTP; bootstrap-kind.sh writes them.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8081
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
