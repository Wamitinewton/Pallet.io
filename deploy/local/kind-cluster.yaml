# A single local cluster that stands in for both the EKS and GKE workload
# clusters scheduler-service will register against later. The deploy path needs
# a real Kubernetes API to talk to; docker-compose alone cannot provide that.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pallet
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8081
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
