# Secrets are create and delete only: build-service writes each build's source token but can never
# read the registry push credential or any other Secret in the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-service
  namespace: pallet-builds
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-service
  namespace: pallet-builds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: build-service
subjects:
  - kind: ServiceAccount
    name: build-service
    namespace: pallet-system
