# Sized for four concurrent builds (2 CPU, 4Gi and 10Gi of ephemeral storage each) plus two of
# headroom, so a bug in admission can't flood the cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: builds
  namespace: pallet-builds
spec:
  hard:
    pods: "6"
    requests.cpu: "13"
    limits.memory: 26Gi
    requests.ephemeral-storage: 64Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: builds
  namespace: pallet-builds
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 256Mi
      max:
        cpu: "4"
        memory: 8Gi
        ephemeral-storage: 20Gi
