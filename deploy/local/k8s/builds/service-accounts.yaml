apiVersion: v1
kind: Namespace
metadata:
  name: pallet-system
  labels:
    pallet.io/purpose: platform
---
# Build pods run as this account. It has no RoleBindings and never gets a token mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pallet-build
  namespace: pallet-builds
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-service
  namespace: pallet-system
